<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <!--
    ====================================================================
    專案名稱：太平山活動 - 現場報到管理系統 (前端)
    版本編號：v1.01
    更新日期：2026/10/23
    更新摘要：
      1. 加入系統版本標記 (v1.01)
      2. 長輩友善高對比、大字級 (18px~28px)、大觸控標靶 (54px+)
      3. 手機底部固定導航操作列 (單手大拇指易點擊)
      4. 報到成功自動中文語音朗讀與雙頻震動
      5. 消除 CORS 阻擋之 text/plain 通訊相容
    ====================================================================
  -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>太平山活動 - 現場報到管理系統 v1.01</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- HTML5-QRCode Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --bg-main: #0d1518;
      --card-bg: #162429;
      --teal-primary: #14b8a6;
      --teal-hover: #0d9488;
      --teal-light: #2dd4bf;
    }
    body {
      background-color: var(--bg-main);
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    input, button {
      -webkit-appearance: none;
      border-radius: 0.75rem;
    }
    #qr-reader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      border-radius: 1rem;
    }
    .modal-enter {
      animation: popIn 0.25s ease-out forwards;
    }
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.92); }
      100% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between pb-24">

  <!-- ================= 登入畫面 ================= -->
  <div id="loginSection" class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-[#162429] border-2 border-teal-600/40 rounded-2xl p-6 sm:p-8 shadow-2xl">
      <div class="text-center mb-6">
        <div class="inline-flex p-3 bg-teal-500/10 rounded-2xl border border-teal-500/30 mb-3">
          <svg class="w-12 h-12 text-teal-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
          </svg>
        </div>
        <div class="flex items-center justify-center gap-2">
          <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-wide">太平山活動管理</h1>
          <span class="px-2 py-0.5 text-xs font-mono font-bold bg-teal-950 text-teal-300 border border-teal-600 rounded">v1.01</span>
        </div>
        <p class="text-teal-300 text-lg mt-1 font-medium">現場工作人員報到入口</p>
      </div>

      <form id="loginForm" class="space-y-5">
        <div>
          <label class="block text-gray-200 text-lg font-bold mb-2">管理者帳號</label>
          <input type="text" id="usernameInput" value="dvs1682001" autocomplete="username"
            class="w-full h-14 px-4 text-xl bg-[#0b1215] border-2 border-gray-600 focus:border-teal-400 rounded-xl text-white outline-none" required />
        </div>
        <div>
          <label class="block text-gray-200 text-lg font-bold mb-2">登入密碼</label>
          <input type="password" id="passwordInput" value="@9771997" autocomplete="current-password"
            class="w-full h-14 px-4 text-xl bg-[#0b1215] border-2 border-gray-600 focus:border-teal-400 rounded-xl text-white outline-none" required />
        </div>
        <div id="loginError" class="hidden text-red-400 text-lg font-bold text-center bg-red-950/40 py-2 border border-red-500 rounded-lg">
          帳號或密碼不正確，請重新輸入
        </div>
        <button type="submit"
          class="w-full h-14 bg-teal-500 hover:bg-teal-600 active:bg-teal-700 text-black text-2xl font-black rounded-xl shadow-lg transition flex items-center justify-center gap-2">
          確認登入
        </button>
      </form>
    </div>
  </div>

  <!-- ================= 主操作介面 ================= -->
  <div id="mainSection" class="hidden flex-1 flex flex-col">
    <header class="bg-[#142226] border-b-2 border-teal-500/40 px-4 py-3 sticky top-0 z-30 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-3.5 h-3.5 rounded-full bg-emerald-400 ring-4 ring-emerald-900/60 animate-pulse"></div>
        <div>
          <div class="flex items-center gap-2">
            <h2 class="text-xl font-bold text-white tracking-wide">太平山報到處</h2>
            <span class="px-1.5 py-0.2 text-xs font-mono font-bold bg-teal-900/80 text-teal-300 border border-teal-600 rounded">v1.01</span>
          </div>
          <p class="text-sm text-teal-300 font-semibold" id="connStatusText">● 系統已就緒</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button id="openConfigBtn" class="p-2.5 bg-gray-800 text-teal-300 rounded-xl border border-teal-500/40 text-lg" title="設定後端網址">
          ⚙️
        </button>
        <button id="logoutBtn" class="px-3.5 py-2 bg-red-900/60 text-red-200 font-bold rounded-xl border border-red-700 text-base">
          登出
        </button>
      </div>
    </header>

    <main class="flex-1 max-w-xl w-full mx-auto p-4 space-y-4">
      <!-- 相機掃描視窗 -->
      <div class="bg-[#162429] border-2 border-teal-500/50 rounded-2xl p-4 shadow-xl">
        <div class="relative bg-black rounded-xl overflow-hidden min-h-[300px] flex flex-col items-center justify-center border border-gray-700">
          <div id="qr-reader" class="w-full h-[320px]"></div>
          
          <div id="cameraStandby" class="absolute inset-0 bg-[#0c1619] flex flex-col items-center justify-center p-6 text-center z-10">
            <svg class="w-20 h-20 text-teal-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            <p class="text-2xl font-bold text-white mb-2">相機待命中</p>
            <p class="text-gray-300 text-base mb-4">請點擊下方按鈕啟動後鏡頭掃描</p>
            <button id="startScanBtn" class="w-full max-w-xs h-14 bg-teal-400 active:bg-teal-500 text-slate-950 text-xl font-black rounded-xl shadow-lg flex items-center justify-center gap-2">
              📷 啟動相機掃描
            </button>
          </div>
        </div>

        <div class="flex gap-2 mt-3">
          <button id="stopScanBtn" class="flex-1 h-12 bg-gray-800 text-gray-200 border border-gray-600 text-lg font-bold rounded-xl hidden">
            暫停相機
          </button>
        </div>
      </div>

      <!-- 手動輸入序號 -->
      <div class="bg-[#162429] border border-gray-700 rounded-2xl p-4 shadow-md">
        <label class="block text-gray-200 text-lg font-bold mb-2">
          🔍 手機掃不到？請直接輸入 12 碼編號：
        </label>
        <div class="flex gap-2">
          <input type="text" id="manualCodeInput" maxlength="12" placeholder="例如: Y5UA6GZLOUDV"
            class="flex-1 h-14 px-3 text-2xl font-mono uppercase bg-[#0b1215] border-2 border-gray-600 focus:border-teal-400 rounded-xl text-white outline-none text-center" />
          <button id="manualVerifyBtn" class="w-28 h-14 bg-teal-500 active:bg-teal-600 text-black text-xl font-black rounded-xl shrink-0">
            查詢
          </button>
        </div>
      </div>

      <!-- 即時名單 -->
      <div class="bg-[#162429] border border-gray-700 rounded-2xl p-4 shadow-md">
        <div class="flex items-center justify-between mb-3 border-b border-gray-700 pb-2">
          <span class="text-xl font-bold text-white flex items-center gap-2">
            📋 最近報到名單
          </span>
          <span id="recordCount" class="text-base px-2.5 py-0.5 rounded-full bg-teal-900/80 text-teal-300 font-bold border border-teal-600">0 人</span>
        </div>
        <div id="checkinHistory" class="space-y-2 max-h-56 overflow-y-auto pr-1">
          <p class="text-gray-400 text-center py-6 text-lg" id="noHistoryText">目前尚未有報到紀錄</p>
        </div>
      </div>
    </main>

    <!-- 底部固定導航 -->
    <nav class="fixed bottom-0 left-0 right-0 bg-[#0d171a] border-t-2 border-teal-500/40 p-2.5 flex gap-2 max-w-xl mx-auto z-20">
      <button id="footerScanBtn" class="flex-1 h-14 bg-teal-500 active:bg-teal-600 text-slate-950 text-xl font-black rounded-xl flex items-center justify-center gap-1 shadow-lg">
        📷 開啟相機
      </button>
      <button id="footerClearBtn" class="w-36 h-14 bg-gray-800 border border-gray-600 text-gray-200 text-lg font-bold rounded-xl flex items-center justify-center">
        清空名單
      </button>
    </nav>
  </div>

  <!-- 核銷結果彈窗 -->
  <div id="resultModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="modal-enter w-full max-w-md bg-[#162429] border-4 rounded-3xl p-6 text-center shadow-2xl relative" id="modalContainer">
      <div id="modalIcon" class="w-20 h-20 mx-auto rounded-full flex items-center justify-center mb-3 text-4xl"></div>
      <h3 id="modalTitle" class="text-3xl font-black text-white mb-2"></h3>
      <p id="modalMsg" class="text-xl text-gray-300 mb-4 font-semibold"></p>

      <div id="modalDetails" class="bg-[#0c1619] border-2 border-gray-700 rounded-2xl p-4 text-left space-y-2 mb-6">
        <div class="flex justify-between items-center text-xl">
          <span class="text-gray-400 font-bold">姓名：</span>
          <span id="detailName" class="text-2xl font-black text-teal-300"></span>
        </div>
        <div class="flex justify-between items-center text-xl">
          <span class="text-gray-400 font-bold">電話：</span>
          <span id="detailPhone" class="text-xl font-mono text-white"></span>
        </div>
        <div class="flex justify-between items-center text-xl">
          <span class="text-gray-400 font-bold">序號：</span>
          <span id="detailCode" class="text-xl font-mono text-yellow-400 font-bold"></span>
        </div>
        <div class="flex justify-between items-center text-lg border-t border-gray-800 pt-2">
          <span class="text-gray-400">報到時間：</span>
          <span id="detailTime" class="text-gray-200 font-mono text-base"></span>
        </div>
      </div>

      <button id="modalContinueBtn"
        class="w-full h-16 bg-teal-400 active:bg-teal-500 text-black text-2xl font-black rounded-2xl shadow-xl flex items-center justify-center gap-2">
        👉 繼續下一位報到
      </button>
    </div>
  </div>

  <!-- 後端設定彈窗 -->
  <div id="configModal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
    <div class="modal-enter w-full max-w-lg bg-[#162429] border-2 border-teal-500 rounded-3xl p-6">
      <h3 class="text-2xl font-black text-white mb-3">⚙️ 系統 API 串接設定 (v1.01)</h3>
      <p class="text-gray-300 text-base mb-4 leading-relaxed">
        請貼上您在 Google 試算表部署的 <b>Apps Script 網頁應用程式網址 (Web App URL)</b>：
      </p>
      
      <div class="space-y-3 mb-5">
        <div>
          <label class="block text-gray-300 text-base font-bold mb-1">試算表 ID：</label>
          <input type="text" readonly value="1zJkGLtCQC1ZZPbQGJiQkxSWec2wRtlKA1pGfmoHaDEY"
            class="w-full h-12 px-3 bg-gray-900 border border-gray-700 rounded-xl text-gray-400 text-base font-mono" />
        </div>
        <div>
          <label class="block text-gray-200 text-lg font-bold mb-1">Apps Script 網址 (以 /exec 結尾)：</label>
          <input type="url" id="cfgAppUrl" placeholder="https://script.google.com/macros/s/.../exec"
            class="w-full h-14 px-3 bg-black border-2 border-teal-400 rounded-xl text-white text-base font-mono outline-none" />
        </div>
      </div>

      <div class="flex gap-2">
        <button id="cfgSaveBtn" class="flex-1 h-14 bg-teal-500 text-black text-xl font-bold rounded-xl">
          儲存並連線
        </button>
        <button id="cfgCloseBtn" class="w-28 h-14 bg-gray-800 text-gray-300 text-lg font-bold rounded-xl">
          關閉
        </button>
      </div>
    </div>
  </div>

  <script>
    const FRONTEND_VERSION = "v1.01";
    let html5QrScanner = null;
    let isProcessing = false;
    let checkinList = [];

    const loginSection = document.getElementById("loginSection");
    const mainSection = document.getElementById("mainSection");
    const loginForm = document.getElementById("loginForm");
    const loginError = document.getElementById("loginError");
    const cameraStandby = document.getElementById("cameraStandby");
    const startScanBtn = document.getElementById("startScanBtn");
    const stopScanBtn = document.getElementById("stopScanBtn");
    const footerScanBtn = document.getElementById("footerScanBtn");
    const manualCodeInput = document.getElementById("manualCodeInput");
    const manualVerifyBtn = document.getElementById("manualVerifyBtn");
    const resultModal = document.getElementById("resultModal");
    const modalContainer = document.getElementById("modalContainer");
    const modalContinueBtn = document.getElementById("modalContinueBtn");
    const checkinHistory = document.getElementById("checkinHistory");
    const recordCount = document.getElementById("recordCount");
    const configModal = document.getElementById("configModal");
    const cfgAppUrl = document.getElementById("cfgAppUrl");
    const connStatusText = document.getElementById("connStatusText");

    let apiUrl = localStorage.getItem("tps_gas_url") || "";
    if (apiUrl) cfgAppUrl.value = apiUrl;

    loginForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const u = document.getElementById("usernameInput").value.trim();
      const p = document.getElementById("passwordInput").value.trim();
      if (u === "dvs1682001" && p === "@9771997") {
        loginError.classList.add("hidden");
        loginSection.classList.add("hidden");
        mainSection.classList.remove("hidden");
        speakText("管理員您好，系統已登入");
        updateStatusLight();
      } else {
        loginError.classList.remove("hidden");
      }
    });

    document.getElementById("logoutBtn").addEventListener("click", () => {
      stopCamera();
      mainSection.classList.add("hidden");
      loginSection.classList.remove("hidden");
    });

    startScanBtn.addEventListener("click", startCamera);
    footerScanBtn.addEventListener("click", startCamera);
    stopScanBtn.addEventListener("click", stopCamera);

    async function startCamera() {
      if (html5QrScanner) {
        stopCamera();
        return;
      }
      cameraStandby.classList.add("hidden");
      stopScanBtn.classList.remove("hidden");

      html5QrScanner = new Html5Qrcode("qr-reader");
      const config = { fps: 12, qrbox: { width: 250, height: 250 } };

      try {
        await html5QrScanner.start(
          { facingMode: "environment" },
          config,
          onScanSuccess,
          () => {}
        );
      } catch (err) {
        alert("無法啟動相機，請檢查瀏覽器相機權限是否已開啟！\n" + err);
        stopCamera();
      }
    }

    function stopCamera() {
      if (html5QrScanner) {
        html5QrScanner.stop().then(() => {
          html5QrScanner.clear();
          html5QrScanner = null;
        }).catch(() => {
          html5QrScanner = null;
        });
      }
      cameraStandby.classList.remove("hidden");
      stopScanBtn.classList.add("hidden");
    }

    function onScanSuccess(decodedText) {
      if (isProcessing) return;
      isProcessing = true;
      triggerHapticFeedback();
      verifyCheckinCode(decodedText.trim());
    }

    manualVerifyBtn.addEventListener("click", () => {
      const code = manualCodeInput.value.trim().toUpperCase();
      if (!code) {
        alert("請先輸入 12 碼報到編號！");
        return;
      }
      if (isProcessing) return;
      isProcessing = true;
      verifyCheckinCode(code);
    });

    async function verifyCheckinCode(code) {
      apiUrl = localStorage.getItem("tps_gas_url") || "";

      if (!apiUrl) {
        alert("請先點擊右上角 ⚙️ 設定您的 Apps Script Web App 網址！");
        configModal.classList.remove("hidden");
        isProcessing = false;
        return;
      }

      showLoadingModal(code);

      try {
        const response = await fetch(apiUrl, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ code: code, clientVersion: FRONTEND_VERSION })
        });
        const result = await response.json();
        handleVerificationResult(result, code);
      } catch (error) {
        console.error("連線錯誤:", error);
        showModalUI("error", "連線失敗", "無法連接至試算表，請確認網路或 API 網址！", { code: code });
        speakText("連線失敗，請重試");
      }
    }

    function handleVerificationResult(res, code) {
      if (res.status === "success") {
        showModalUI("success", "報到成功！", "已順利更新試算表報到狀態", res);
        triggerSuccessVibration();
        speakText(res.name + " 報到成功");
        addHistoryItem(res.name, res.code, res.checkinTime, "success");
      } else if (res.status === "already_checked") {
        showModalUI("warning", "重複報到！", "此報到編號先前已經完成報到！", res);
        triggerWarnVibration();
        speakText(res.name + " 已在稍早完成報到");
        addHistoryItem(res.name, res.code, res.checkinTime, "duplicate");
      } else {
        showModalUI("error", "查無此編號！", "試算表中無此報到編號，請重新確認！", { code: code });
        triggerWarnVibration();
        speakText("查無此編號");
      }
    }

    function showLoadingModal(code) {
      resultModal.classList.remove("hidden");
      modalContainer.className = "modal-enter w-full max-w-md bg-[#162429] border-4 border-teal-500 rounded-3xl p-6 text-center shadow-2xl relative";
      document.getElementById("modalIcon").innerHTML = "⏳";
      document.getElementById("modalIcon").className = "w-20 h-20 mx-auto rounded-full bg-teal-900/60 flex items-center justify-center mb-3 text-4xl animate-spin";
      document.getElementById("modalTitle").innerText = "核對資料中...";
      document.getElementById("modalMsg").innerText = "正在連線 Google 試算表，請稍候";
      document.getElementById("modalDetails").classList.add("hidden");
    }

    function showModalUI(type, title, msg, data) {
      resultModal.classList.remove("hidden");
      document.getElementById("modalDetails").classList.remove("hidden");
      document.getElementById("modalTitle").innerText = title;
      document.getElementById("modalMsg").innerText = msg;
      document.getElementById("detailName").innerText = data.name || "未知";
      document.getElementById("detailPhone").innerText = data.phone || "無";
      document.getElementById("detailCode").innerText = data.code || "";
      document.getElementById("detailTime").innerText = data.checkinTime || new Date().toLocaleTimeString();

      const icon = document.getElementById("modalIcon");
      if (type === "success") {
        modalContainer.className = "modal-enter w-full max-w-md bg-[#162429] border-4 border-emerald-500 rounded-3xl p-6 text-center shadow-2xl relative";
        icon.className = "w-20 h-20 mx-auto rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center mb-3 text-5xl";
        icon.innerHTML = "✓";
      } else if (type === "warning") {
        modalContainer.className = "modal-enter w-full max-w-md bg-[#162429] border-4 border-amber-500 rounded-3xl p-6 text-center shadow-2xl relative";
        icon.className = "w-20 h-20 mx-auto rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center mb-3 text-5xl";
        icon.innerHTML = "⚠️";
      } else {
        modalContainer.className = "modal-enter w-full max-w-md bg-[#162429] border-4 border-rose-500 rounded-3xl p-6 text-center shadow-2xl relative";
        icon.className = "w-20 h-20 mx-auto rounded-full bg-rose-500/20 text-rose-400 flex items-center justify-center mb-3 text-5xl";
        icon.innerHTML = "✕";
      }
    }

    modalContinueBtn.addEventListener("click", () => {
      resultModal.classList.add("hidden");
      manualCodeInput.value = "";
      isProcessing = false;
    });

    function addHistoryItem(name, code, time, type) {
      document.getElementById("noHistoryText")?.classList.add("hidden");
      const div = document.createElement("div");
      div.className = "flex items-center justify-between p-3.5 bg-[#0e171a] border border-gray-700 rounded-xl text-lg";
      
      const isSuccess = type === "success";
      div.innerHTML = `
        <div>
          <div class="text-xl font-black text-white">${name}</div>
          <div class="text-sm font-mono text-gray-400">${code}</div>
        </div>
        <div class="text-right">
          <span class="px-2.5 py-1 text-sm font-bold rounded-md ${isSuccess ? 'bg-emerald-950 text-emerald-400 border border-emerald-700' : 'bg-amber-950 text-amber-400 border border-amber-700'}">
            ${isSuccess ? '報到成功' : '重複核對'}
          </span>
          <div class="text-xs text-gray-400 mt-1 font-mono">${time.split(" ")[1] || time}</div>
        </div>
      `;
      checkinHistory.prepend(div);
      checkinList.push(code);
      recordCount.innerText = `${checkinList.length} 人`;
    }

    document.getElementById("footerClearBtn").addEventListener("click", () => {
      if (confirm("確定要清除畫面上的暫存報到名單嗎？（不會影響 Google 試算表資料）")) {
        checkinHistory.innerHTML = '<p class="text-gray-400 text-center py-6 text-lg" id="noHistoryText">目前尚未有報到紀錄</p>';
        checkinList = [];
        recordCount.innerText = "0 人";
      }
    });

    document.getElementById("openConfigBtn").addEventListener("click", () => {
      configModal.classList.remove("hidden");
    });
    document.getElementById("cfgCloseBtn").addEventListener("click", () => {
      configModal.classList.add("hidden");
    });
    document.getElementById("cfgSaveBtn").addEventListener("click", () => {
      const url = cfgAppUrl.value.trim();
      if (!url) {
        alert("請填寫有效的 Apps Script 網址！");
        return;
      }
      localStorage.setItem("tps_gas_url", url);
      apiUrl = url;
      configModal.classList.add("hidden");
      updateStatusLight();
      alert("設定儲存成功！");
    });

    function updateStatusLight() {
      if (localStorage.getItem("tps_gas_url")) {
        connStatusText.innerText = "● 已連線試算表 API";
        connStatusText.className = "text-sm text-emerald-400 font-bold";
      } else {
        connStatusText.innerText = "● 尚未設定後端 API (點右上方⚙️)";
        connStatusText.className = "text-sm text-amber-400 font-bold";
      }
    }

    function speakText(text) {
      if ("speechSynthesis" in window) {
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = "zh-TW";
        utter.rate = 1.0;
        window.speechSynthesis.speak(utter);
      }
    }

    function triggerHapticFeedback() {
      if (navigator.vibrate) navigator.vibrate(60);
    }
    function triggerSuccessVibration() {
      if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
    }
    function triggerWarnVibration() {
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    }
  </script>
</body>
</html>
